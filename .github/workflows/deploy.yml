name: Deploy AI Service to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy AI Service (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SARVAM_API_KEY_1: ${{ secrets.SARVAM_API_KEY_1 }}
          SARVAM_API_KEY_2: ${{ secrets.SARVAM_API_KEY_2 }}
          SARVAM_API_KEY_3: ${{ secrets.SARVAM_API_KEY_3 }}
          DJANGO_SECRET_KEY: ${{ secrets.PROD_DJANGO_SECRET_KEY || secrets.DEV_DJANGO_SECRET_KEY }}
          AI_API_KEY: ${{ secrets.PROD_AI_API_KEY || secrets.DEV_AI_API_KEY }}
          DB_ENGINE: ${{ secrets.AI_DB_ENGINE }}
          DB_NAME: ${{ secrets.PROD_AI_DB_NAME || secrets.DEV_AI_DB_NAME }}
          DB_USER: ${{ secrets.AI_DB_USER }}
          DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
          DB_HOST: ${{ secrets.AI_DB_HOST }}
          DB_PORT: ${{ secrets.AI_DB_PORT }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          # NOTE: forwarded as PROD_REDIS_URL, NOT REDIS_URL. If the secret is unset,
          # ssh-action exports the var as an EMPTY string, and load_dotenv() will not
          # override an already-set (even empty) env var — which would shadow the
          # REDIS_URL we write into .env and crash settings.py.
          PROD_REDIS_URL: ${{ secrets.REDIS_URL }}
          # Optional override for the backend base URL (not named NESTJS_INTERNAL_URL,
          # so an unset secret can't shadow the value we write to .env).
          PROD_NESTJS_URL: ${{ secrets.PROD_NESTJS_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          envs: GH_PAT,GROQ_API_KEY,GEMINI_API_KEY,SERPAPI_KEY,SARVAM_API_KEY,SARVAM_API_KEY_1,SARVAM_API_KEY_2,SARVAM_API_KEY_3,DJANGO_SECRET_KEY,AI_API_KEY,DB_ENGINE,DB_NAME,DB_USER,DB_PASSWORD,DB_HOST,DB_PORT,INTERNAL_API_KEY,PROD_REDIS_URL,GROQ_API_KEYS,PROD_NESTJS_URL
          script: |
            set -e
            AI_DIR=/home/ubuntu/eddva_ai_service

            echo "Pulling latest code..."
            cd $AI_DIR
            git fetch origin main
            git reset --hard origin/main

            echo "Writing .env from secrets..."
            # An unset CI secret arrives as an empty string. Writing AI_API_KEY="" means
            # no tenant can be seeded, so every request 401s. Default it rather than
            # writing a blank. (ALLOWED_HOSTS/CORS are hardcoded below, so they're safe.)
            AI_API_KEY_VALUE="${AI_API_KEY:-apexiq-dev-secret-key-2026}"
            # Export the resolved value back over the (possibly empty) forwarded one:
            # load_dotenv() will not override an already-set env var, even an empty one,
            # so an empty AI_API_KEY in the environment would shadow what we write to .env.
            export AI_API_KEY="$AI_API_KEY_VALUE"

            printf 'GROQ_API_KEY=%s\n'          "$GROQ_API_KEY"        > .env
            # Optional: comma-separated list of Groq keys for rotation (the client
            # reads GROQ_API_KEY, GROQ_API_KEYS, or GROQ_API_KEY_1..N).
            printf 'GROQ_API_KEYS=%s\n'         "$GROQ_API_KEYS"       >> .env
            printf 'GEMINI_API_KEY=%s\n'        "$GEMINI_API_KEY"      >> .env
            printf 'SERPAPI_KEY=%s\n'           "$SERPAPI_KEY"         >> .env
            printf 'SARVAM_API_KEY=%s\n'        "$SARVAM_API_KEY"      >> .env
            printf 'SARVAM_API_KEY_1=%s\n'      "$SARVAM_API_KEY_1"    >> .env
            printf 'SARVAM_API_KEY_2=%s\n'      "$SARVAM_API_KEY_2"    >> .env
            printf 'SARVAM_API_KEY_3=%s\n'      "$SARVAM_API_KEY_3"    >> .env
            printf 'DJANGO_SECRET_KEY=%s\n'     "$DJANGO_SECRET_KEY"   >> .env
            printf 'AI_API_KEY=%s\n'            "$AI_API_KEY_VALUE"    >> .env
            printf 'DJANGO_DEBUG=false\n'                              >> .env
            printf 'ALLOWED_HOSTS=ai.eddva.in,localhost,127.0.0.1\n'  >> .env
            printf 'CORS_ALLOWED_ORIGINS=https://eddva.in,https://api.eddva.in,https://dev-api.eddva.in\n' >> .env
            printf 'DB_ENGINE=%s\n'             "$DB_ENGINE"           >> .env
            printf 'DB_NAME=%s\n'               "$DB_NAME"             >> .env
            printf 'DB_USER=%s\n'               "$DB_USER"             >> .env
            printf 'DB_PASSWORD=%s\n'           "$DB_PASSWORD"         >> .env
            printf 'DB_HOST=%s\n'               "$DB_HOST"             >> .env
            printf 'DB_PORT=%s\n'               "$DB_PORT"             >> .env
            # The NestJS backend runs on a DIFFERENT EC2 box, so localhost is nobody here:
            # usage logging failed with "Connection refused" on every AI call, so no
            # usage/billing data reached the backend. Point at the real host.
            # (Backend prod = api.eddva.in, port 3000. Swap for the private VPC IP if you
            #  would rather keep this traffic off the public internet.)
            printf 'NESTJS_INTERNAL_URL=%s\n'   "${PROD_NESTJS_URL:-https://api.eddva.in}" >> .env
            printf 'INTERNAL_API_KEY=%s\n'      "$INTERNAL_API_KEY"    >> .env
            # Redis is REQUIRED — it backs the response cache, per-tenant token caps
            # and cross-worker concurrency limits. Redis runs on this box; prod uses
            # DB 0 (dev uses DB 1) so the two never share cache keys. Override with
            # the REDIS_URL repo secret to point at a managed Redis.
            # (Replaces the old REDIS_OPTIONAL=true escape hatch, which silently
            #  disabled caching and left per-tenant token caps unenforced.)
            REDIS_URL_VALUE="${PROD_REDIS_URL:-redis://127.0.0.1:6379/0}"
            printf 'REDIS_URL=%s\n'             "$REDIS_URL_VALUE"     >> .env
            # Export too, so migrate/gunicorn see it regardless of load_dotenv ordering.
            export REDIS_URL="$REDIS_URL_VALUE"

            echo "Installing Python dependencies..."
            source venv/bin/activate
            pip install -r requirements.txt --quiet

            echo "Running migrations..."
            python manage.py migrate --noinput

            # Ensure the NestJS ai-bridge service-account tenant exists. Requests are
            # authenticated against the Institute table; an empty table 401s everything.
            echo "Ensuring service-account tenant..."
            python manage.py ensure_service_account --api-key "$AI_API_KEY_VALUE"

            # Prod is managed by pm2 (ai-service-prod → start.sh), not systemd.
            #
            # The old systemd unit `eddva-ai` was left enabled alongside pm2 and the two
            # fought over port 8000: whichever lost exited, pm2 restarted it, and the
            # loop ran up ~78,000 restarts. `eddva-ai` is now stopped and disabled — do
            # NOT restart it here, because `systemctl restart` starts a unit even when it
            # is disabled, which would recreate the conflict on every deploy.
            echo "Restarting AI service (pm2)..."
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            if pm2 describe ai-service-prod > /dev/null 2>&1; then
              pm2 restart ai-service-prod --update-env
            else
              # First run after the systemd → pm2 move: create the process.
              pm2 start "$AI_DIR/start.sh" --name ai-service-prod --cwd "$AI_DIR"
            fi
            pm2 save

            echo "Health check..."
            sleep 6
            # Check the app actually answers, not just that a process exists — a green
            # process that 400s/500s every request is not a working service.
            code=$(curl -s -o /dev/null -w '%{http_code}' -X GET http://127.0.0.1:8000/ai/health \
                     -H "Host: ai.eddva.in" \
                     -H "X-API-Key: $AI_API_KEY_VALUE" || echo 000)
            if [ "$code" = "200" ]; then
              echo "✅ AI service is running (health check HTTP $code)"
            else
              echo "❌ Health check returned HTTP $code"
              pm2 logs ai-service-prod --lines 30 --nostream || true
              exit 1
            fi

            echo "AI Service deployed successfully at $(date)"
