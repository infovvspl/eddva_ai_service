name: Deploy AI Service (DEV)

on:
  push:
    branches: [dev]

jobs:
  deploy:
    name: Deploy AI Service (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AI EC2 (DEV)
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.DEV_AI_ALLOWED_HOSTS }}
          AI_API_KEY: ${{ secrets.DEV_AI_API_KEY }}
          WHISPER_MODEL: "base"
          WHISPER_DEVICE: "cpu"
          WHISPER_COMPUTE_TYPE: "int8"
          DJANGO_DEBUG: "false"
          DB_ENGINE: ${{ secrets.AI_DB_ENGINE }}
          DB_NAME: ${{ secrets.DEV_AI_DB_NAME }}
          DB_USER: ${{ secrets.AI_DB_USER }}
          DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
          DB_HOST: ${{ secrets.AI_DB_HOST }}
          DB_PORT: ${{ secrets.AI_DB_PORT }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.DEV_AI_CORS_ORIGINS }}
          # NOTE: forwarded as DEV_REDIS_URL, NOT REDIS_URL. If the secret is unset,
          # ssh-action exports the var as an EMPTY string, and load_dotenv() will not
          # override an already-set (even empty) env var — which would shadow the
          # REDIS_URL we write into .env and crash settings.py.
          DEV_REDIS_URL: ${{ secrets.DEV_REDIS_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          envs: GH_PAT,GROQ_API_KEY,GEMINI_API_KEY,SERPAPI_KEY,SARVAM_API_KEY,DJANGO_SECRET_KEY,ALLOWED_HOSTS,AI_API_KEY,WHISPER_MODEL,WHISPER_DEVICE,WHISPER_COMPUTE_TYPE,DJANGO_DEBUG,DB_ENGINE,DB_NAME,DB_USER,DB_PASSWORD,DB_HOST,DB_PORT,CORS_ALLOWED_ORIGINS,DEV_REDIS_URL,GROQ_API_KEYS
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            AI_DIR=$HOME/eddva_ai_service_dev

            # Clone on first deploy (private repo — use GH_PAT)
            if [ ! -d "$AI_DIR/.git" ]; then
              git clone -b dev https://$GH_PAT@github.com/infovvspl/eddva_ai_service.git $AI_DIR
              cd $AI_DIR
              python3.11 -m venv venv
            fi

            # Pull latest code (hard reset avoids merge conflicts)
            cd $AI_DIR
            git fetch https://$GH_PAT@github.com/infovvspl/eddva_ai_service.git dev
            git reset --hard FETCH_HEAD

            # Resolve values that MUST NOT be blank. An unset CI secret arrives as an
            # empty string, and writing that to .env silently breaks the service:
            #   ALLOWED_HOSTS=""  -> Django 400s EVERY request (DisallowedHost)
            #   AI_API_KEY=""     -> no tenant can be seeded, so every request 401s
            # Both actually happened. Default them instead of writing blanks.
            ALLOWED_HOSTS_VALUE="${ALLOWED_HOSTS:-dev-ai.eddva.in,localhost,127.0.0.1}"
            CORS_VALUE="${CORS_ALLOWED_ORIGINS:-https://dev.eddva.in,https://dev-api.eddva.in}"
            AI_API_KEY_VALUE="${AI_API_KEY:-apexiq-dev-secret-key-2026}"

            # CRITICAL: export the RESOLVED values back over the empty ones.
            # ssh-action exports every var listed in `envs:` — including secrets that
            # are unset, which arrive as EMPTY strings. load_dotenv() does not override
            # an already-set env var (even an empty one), so an empty ALLOWED_HOSTS in
            # the environment SHADOWS the value we just wrote to .env: `migrate` then
            # dies with "ALLOWED_HOSTS is empty in production", and gunicorn would boot
            # the same way because pm2 inherits this shell's environment.
            export ALLOWED_HOSTS="$ALLOWED_HOSTS_VALUE"
            export CORS_ALLOWED_ORIGINS="$CORS_VALUE"
            export AI_API_KEY="$AI_API_KEY_VALUE"

            # Write .env (printf avoids leading-whitespace issues from heredoc)
            printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" > .env
            # Optional: comma-separated list of Groq keys for rotation (the client
            # reads GROQ_API_KEY, GROQ_API_KEYS, or GROQ_API_KEY_1..N).
            printf 'GROQ_API_KEYS=%s\n' "$GROQ_API_KEYS" >> .env
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
            printf 'SERPAPI_KEY=%s\n' "$SERPAPI_KEY" >> .env
            printf 'SARVAM_API_KEY=%s\n' "$SARVAM_API_KEY" >> .env
            printf 'DJANGO_SECRET_KEY=%s\n' "$DJANGO_SECRET_KEY" >> .env
            printf 'ALLOWED_HOSTS=%s\n' "$ALLOWED_HOSTS_VALUE" >> .env
            printf 'AI_API_KEY=%s\n' "$AI_API_KEY_VALUE" >> .env
            printf 'WHISPER_MODEL=%s\n' "$WHISPER_MODEL" >> .env
            printf 'WHISPER_DEVICE=%s\n' "$WHISPER_DEVICE" >> .env
            printf 'WHISPER_COMPUTE_TYPE=%s\n' "$WHISPER_COMPUTE_TYPE" >> .env
            printf 'DJANGO_DEBUG=%s\n' "$DJANGO_DEBUG" >> .env
            printf 'DB_ENGINE=%s\n' "$DB_ENGINE" >> .env
            printf 'DB_NAME=%s\n' "$DB_NAME" >> .env
            printf 'DB_USER=%s\n' "$DB_USER" >> .env
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" >> .env
            printf 'DB_HOST=%s\n' "$DB_HOST" >> .env
            printf 'DB_PORT=%s\n' "$DB_PORT" >> .env
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "$CORS_VALUE" >> .env
            printf 'NESTJS_INTERNAL_URL=http://localhost:3001\n' >> .env
            printf 'INTERNAL_API_KEY=edva_internal_ai_log_2026\n' >> .env
            # Redis is REQUIRED (response cache, token caps, cross-worker concurrency).
            # Dev uses Redis DB 1 so it never shares cache keys with prod (DB 0).
            # Replaces the old REDIS_OPTIONAL=true, which silently disabled caching.
            REDIS_URL_VALUE="${DEV_REDIS_URL:-redis://127.0.0.1:6379/1}"
            printf 'REDIS_URL=%s\n' "$REDIS_URL_VALUE" >> .env
            # Export it too, so migrate/gunicorn see it even before load_dotenv runs.
            export REDIS_URL="$REDIS_URL_VALUE"

            # Install dependencies (requirements.txt has gunicorn, groq, django-cors-headers)
            venv/bin/pip install -r requirements.txt --quiet

            # Django migrations
            venv/bin/python manage.py migrate --noinput

            # Ensure the NestJS ai-bridge service-account tenant EXISTS.
            # Every request is authenticated against the Institute table, so with an
            # empty table the service 401s everything. The previous inline snippet only
            # *updated* an already-existing row and never created one — which is why the
            # tenant table stayed empty and the service was unusable. Not `|| true`:
            # if this fails we want the deploy to go red, not ship a dead service.
            venv/bin/python manage.py ensure_service_account --api-key "$AI_API_KEY_VALUE"

            # Restart: delete + start so the fresh .env is picked up
            mkdir -p $HOME/logs
            if pm2 list | grep -q ai-service-dev; then
              pm2 delete ai-service-dev
            fi
            pm2 start $AI_DIR/venv/bin/gunicorn \
              --name ai-service-dev \
              --interpreter none \
              --log $HOME/logs/ai-dev.log \
              -- ai_study_project.wsgi:application \
                 --bind 0.0.0.0:8001 \
                 --workers 2 \
                 --timeout 120
            pm2 save

            echo "AI Service deployed on port 8001 at $(date)"

      - name: Notify success
        if: success()
        run: echo "DEV AI Service deployed to dev-ai.eddva.in (port 8001)"
