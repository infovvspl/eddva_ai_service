name: Deploy AI Service (DEV)

on:
  push:
    branches: [dev]

jobs:
  deploy:
    name: Deploy AI Service (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AI EC2 (DEV)
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Comma-separated extra Gemini keys, mirroring GROQ_API_KEYS above.
          # Without this the deploy writes only the single key and the service
          # drops from six keys to one — every vision and grounded call then
          # shares one project's quota.
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          # Left unset on purpose: an unset secret arrives as an empty string,
          # which is exactly the value that skips the withdrawn Groq vision
          # models. Set it only if the account serves vision models again.
          GROQ_VISION_MODELS: ${{ secrets.GROQ_VISION_MODELS }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.DEV_AI_ALLOWED_HOSTS }}
          AI_API_KEY: ${{ secrets.DEV_AI_API_KEY }}
          WHISPER_MODEL: "base"
          WHISPER_DEVICE: "cpu"
          WHISPER_COMPUTE_TYPE: "int8"
          DJANGO_DEBUG: "false"
          DB_ENGINE: ${{ secrets.AI_DB_ENGINE }}
          DB_NAME: ${{ secrets.DEV_AI_DB_NAME }}
          DB_USER: ${{ secrets.AI_DB_USER }}
          DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
          DB_HOST: ${{ secrets.AI_DB_HOST }}
          DB_PORT: ${{ secrets.AI_DB_PORT }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.DEV_AI_CORS_ORIGINS }}
          # NOTE: forwarded as DEV_REDIS_URL, NOT REDIS_URL. If the secret is unset,
          # ssh-action exports the var as an EMPTY string, and load_dotenv() will not
          # override an already-set (even empty) env var — which would shadow the
          # REDIS_URL we write into .env and crash settings.py.
          DEV_REDIS_URL: ${{ secrets.DEV_REDIS_URL }}
          # Optional override for the backend base URL (not named NESTJS_INTERNAL_URL,
          # so an unset secret can't shadow the value we write to .env).
          DEV_NESTJS_URL: ${{ secrets.DEV_NESTJS_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          envs: GH_PAT,GROQ_API_KEY,GEMINI_API_KEY,GEMINI_API_KEYS,GROQ_VISION_MODELS,SERPAPI_KEY,SARVAM_API_KEY,DJANGO_SECRET_KEY,ALLOWED_HOSTS,AI_API_KEY,WHISPER_MODEL,WHISPER_DEVICE,WHISPER_COMPUTE_TYPE,DJANGO_DEBUG,DB_ENGINE,DB_NAME,DB_USER,DB_PASSWORD,DB_HOST,DB_PORT,CORS_ALLOWED_ORIGINS,DEV_REDIS_URL,GROQ_API_KEYS,DEV_NESTJS_URL
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            AI_DIR=$HOME/eddva_ai_service_dev

            # Clone on first deploy (private repo — use GH_PAT)
            if [ ! -d "$AI_DIR/.git" ]; then
              git clone -b dev https://$GH_PAT@github.com/infovvspl/eddva_ai_service.git $AI_DIR
              cd $AI_DIR
              python3.11 -m venv venv
            fi

            # Pull latest code (hard reset avoids merge conflicts)
            cd $AI_DIR
            git fetch https://$GH_PAT@github.com/infovvspl/eddva_ai_service.git dev
            git reset --hard FETCH_HEAD

            # Resolve values that MUST NOT be blank. An unset CI secret arrives as an
            # empty string, and writing that to .env silently breaks the service:
            #   ALLOWED_HOSTS=""  -> Django 400s EVERY request (DisallowedHost)
            #   AI_API_KEY=""     -> no tenant can be seeded, so every request 401s
            # Both actually happened. Default them instead of writing blanks.
            # 172.31.20.183 is this instance's own private address. The dev NestJS
            # backend calls the AI service directly on http://172.31.20.183:8001,
            # so that host must be allowed or every POST from the backend fails
            # with a 400 DisallowedHost — while GETs and health checks keep
            # returning 200, because Django only validates the host on unsafe
            # methods. Leaving it out of this default silently broke content and
            # doubt generation three separate times: each deploy rewrote .env from
            # here, quietly undoing the value that had been set on the box.
            ALLOWED_HOSTS_VALUE="${ALLOWED_HOSTS:-dev-ai.eddva.in,localhost,127.0.0.1,172.31.20.183}"
            CORS_VALUE="${CORS_ALLOWED_ORIGINS:-https://dev.eddva.in,https://dev-api.eddva.in}"
            AI_API_KEY_VALUE="${AI_API_KEY:-apexiq-dev-secret-key-2026}"

            # CRITICAL: export the RESOLVED values back over the empty ones.
            # ssh-action exports every var listed in `envs:` — including secrets that
            # are unset, which arrive as EMPTY strings. load_dotenv() does not override
            # an already-set env var (even an empty one), so an empty ALLOWED_HOSTS in
            # the environment SHADOWS the value we just wrote to .env: `migrate` then
            # dies with "ALLOWED_HOSTS is empty in production", and gunicorn would boot
            # the same way because pm2 inherits this shell's environment.
            export ALLOWED_HOSTS="$ALLOWED_HOSTS_VALUE"
            export CORS_ALLOWED_ORIGINS="$CORS_VALUE"
            export AI_API_KEY="$AI_API_KEY_VALUE"

            # Capture numbered provider keys before .env is truncated below.
            #
            # This file is rewritten from scratch on every deploy, so any key
            # added directly on the box disappears without a word. That happened
            # three times in one day with GEMINI_API_KEY_1..5: the service
            # silently dropped from six Gemini keys to one, and the next grounded
            # generation failed because the single remaining key was rate-limited.
            #
            # Carried over unconditionally. Making this conditional on the
            # GEMINI_API_KEYS secret being unset was itself a trap: setting that
            # secret to add a key would silently delete every numbered key on the
            # box, shrinking the pool at the exact moment someone was trying to
            # grow it. get_gemini_api_keys() de-duplicates, so a key that appears
            # in both places costs nothing.
            #
            # The trade-off is that a key removed from the box only disappears
            # once .env is edited there; rotating a key out means deleting its
            # line on the server, not just dropping it from the secret.
            PRESERVED_GEMINI=""
            if [ -f .env ]; then
              PRESERVED_GEMINI="$(grep -E '^GEMINI_API_KEY_[0-9]+=.+' .env || true)"
            fi

            # Write .env (printf avoids leading-whitespace issues from heredoc)
            printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" > .env
            # Optional: comma-separated list of Groq keys for rotation (the client
            # reads GROQ_API_KEY, GROQ_API_KEYS, or GROQ_API_KEY_1..N).
            printf 'GROQ_API_KEYS=%s\n' "$GROQ_API_KEYS" >> .env
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
            # Extra Gemini keys for rotation (the client reads GEMINI_API_KEY,
            # GEMINI_API_KEYS, or GEMINI_API_KEY_1..N). Vision, textbook OCR and
            # grounded generation all run on Gemini, so writing only the single
            # key silently drops the service from six keys to one.
            printf 'GEMINI_API_KEYS=%s\n' "$GEMINI_API_KEYS" >> .env
            # Numbered keys that were on the box and are not managed by a secret.
            if [ -n "$PRESERVED_GEMINI" ]; then
              printf '%s\n' "$PRESERVED_GEMINI" >> .env
              echo "Preserved $(printf '%s\n' "$PRESERVED_GEMINI" | wc -l) existing GEMINI_API_KEY_n entries"
            fi
            # Groq withdrew its llama-3.2 vision models, so the vision path tries
            # two models that always 404 before falling through to Gemini. An
            # empty value skips Groq entirely; set the secret to a comma-separated
            # list if the account serves vision models again.
            printf 'GROQ_VISION_MODELS=%s\n' "$GROQ_VISION_MODELS" >> .env
            printf 'SERPAPI_KEY=%s\n' "$SERPAPI_KEY" >> .env
            printf 'SARVAM_API_KEY=%s\n' "$SARVAM_API_KEY" >> .env
            printf 'DJANGO_SECRET_KEY=%s\n' "$DJANGO_SECRET_KEY" >> .env
            printf 'ALLOWED_HOSTS=%s\n' "$ALLOWED_HOSTS_VALUE" >> .env
            printf 'AI_API_KEY=%s\n' "$AI_API_KEY_VALUE" >> .env
            printf 'WHISPER_MODEL=%s\n' "$WHISPER_MODEL" >> .env
            printf 'WHISPER_DEVICE=%s\n' "$WHISPER_DEVICE" >> .env
            printf 'WHISPER_COMPUTE_TYPE=%s\n' "$WHISPER_COMPUTE_TYPE" >> .env
            printf 'DJANGO_DEBUG=%s\n' "$DJANGO_DEBUG" >> .env
            printf 'DB_ENGINE=%s\n' "$DB_ENGINE" >> .env
            printf 'DB_NAME=%s\n' "$DB_NAME" >> .env
            printf 'DB_USER=%s\n' "$DB_USER" >> .env
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" >> .env
            printf 'DB_HOST=%s\n' "$DB_HOST" >> .env
            printf 'DB_PORT=%s\n' "$DB_PORT" >> .env
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "$CORS_VALUE" >> .env
            # The NestJS backend runs on a DIFFERENT EC2 box, so localhost is nobody here:
            # usage logging was failing with "Connection refused" on every AI call and no
            # usage/billing data was reaching the backend. Point at the real host.
            # (Backend dev = dev-api.eddva.in, port 3001. Swap for the private VPC IP if
            #  you'd rather keep this traffic off the public internet.)
            printf 'NESTJS_INTERNAL_URL=%s\n' "${DEV_NESTJS_URL:-https://dev-api.eddva.in}" >> .env
            printf 'INTERNAL_API_KEY=edva_internal_ai_log_2026\n' >> .env
            # Redis is REQUIRED (response cache, token caps, cross-worker concurrency).
            # Dev uses Redis DB 1 so it never shares cache keys with prod (DB 0).
            # Replaces the old REDIS_OPTIONAL=true, which silently disabled caching.
            REDIS_URL_VALUE="${DEV_REDIS_URL:-redis://127.0.0.1:6379/1}"
            printf 'REDIS_URL=%s\n' "$REDIS_URL_VALUE" >> .env
            # Export it too, so migrate/gunicorn see it even before load_dotenv runs.
            export REDIS_URL="$REDIS_URL_VALUE"

            # Install dependencies (requirements.txt has gunicorn, groq, django-cors-headers)
            venv/bin/pip install -r requirements.txt --quiet

            # Django migrations
            venv/bin/python manage.py migrate --noinput

            # Ensure the NestJS ai-bridge service-account tenant EXISTS.
            # Every request is authenticated against the Institute table, so with an
            # empty table the service 401s everything. The previous inline snippet only
            # *updated* an already-existing row and never created one — which is why the
            # tenant table stayed empty and the service was unusable. Not `|| true`:
            # if this fails we want the deploy to go red, not ship a dead service.
            venv/bin/python manage.py ensure_service_account --api-key "$AI_API_KEY_VALUE"

            # Restart: delete + start so the fresh .env is picked up
            mkdir -p $HOME/logs
            if pm2 list | grep -q ai-service-dev; then
              pm2 delete ai-service-dev
            fi
            pm2 start $AI_DIR/venv/bin/gunicorn \
              --name ai-service-dev \
              --interpreter none \
              --log $HOME/logs/ai-dev.log \
              -- ai_study_project.wsgi:application \
                 --bind 0.0.0.0:8001 \
                 --workers 2 \
                 --timeout 120
            pm2 save

            echo "AI Service deployed on port 8001 at $(date)"

      - name: Notify success
        if: success()
        run: echo "DEV AI Service deployed to dev-ai.eddva.in (port 8001)"
